apiVersion: apps/v1
kind: Deployment
metadata:
  name: phongtro-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phongtro-fe
  template:
    metadata:
      labels:
        app: phongtro-fe
    spec:
      containers:
      - name: phongtro-fe
        image: phongtro-fe:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: phongtro-fe
spec:
  type: NodePort
  selector:
    app: phongtro-fe
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
