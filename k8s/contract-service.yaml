apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-service
  template:
    metadata:
      labels:
        app: contract-service
    spec:
      containers:
      - name: contract-service
        image: contract-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/contract_db?createDatabaseIfNotExist=true
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: spring-config
              key: MYSQL_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: spring-config
              key: MYSQL_PASSWORD
        - name: ROOM_SERVICE_URL
          value: http://room-service:8081
        - name: TENANT_SERVICE_URL
          value: http://tenant-service:8082
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
spec:
  selector:
    app: contract-service
  ports:
  - port: 8083
    targetPort: 8083
