spring.application.name=api-gateway
server.port=8080

# Routes đến các microservice (Đã sửa đúng port theo code thực tế)
spring.cloud.gateway.routes[0].id=room
spring.cloud.gateway.routes[0].uri=http://room-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/rooms/**

spring.cloud.gateway.routes[1].id=tenant
spring.cloud.gateway.routes[1].uri=http://tenant-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/tenants/**

spring.cloud.gateway.routes[2].id=contract
spring.cloud.gateway.routes[2].uri=http://contract-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/contracts/**

spring.cloud.gateway.routes[3].id=invoice
spring.cloud.gateway.routes[3].uri=http://invoice-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/invoices/**